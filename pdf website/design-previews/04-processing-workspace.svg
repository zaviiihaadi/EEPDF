  <text x="1134" y="222" class="tiny muted">File name</text>
  <text x="1134" y="239" class="small" font-weight="550">Northstar_invoice_scan.pdf</text>
  <text x="1134" y="265" class="tiny muted">Pages</text>
  <text x="1407" y="265" text-anchor="end" class="small" font-weight="550">8</text>
  <text x="1134" y="289" class="tiny muted">File size</text>
  <text x="1407" y="289" text-anchor="end" class="small" font-weight="550">2.4 MB</text>
  <text x="1134" y="313" class="tiny muted">Uploaded</text>
  <text x="1407" y="313" text-anchor="end" class="small" font-weight="550">Today, 10:42 AM</text>
  <line x1="1134" y1="331" x2="1417" y2="331" class="line"/>

  <!-- OCR status -->
  <text x="1134" y="358" class="label muted">OCR STATUS</text>
  <circle cx="1140" cy="381" r="4" fill="#39815d"/>
  <text x="1152" y="385" class="small" font-weight="600">Processing complete</text>
  <text x="1417" y="385" text-anchor="end" class="tiny muted">8 / 8 pages</text>
  <rect x="1134" y="398" width="283" height="5" rx="2.5" fill="#e8efea"/>
  <rect x="1134" y="398" width="283" height="5" rx="2.5" fill="#4b8c69"/>
  <rect x="1134" y="416" width="283" height="33" rx="6" fill="#fff7e9"/>
  <circle cx="1148" cy="432" r="3.2" fill="#c58424"/>
  <text x="1158" y="436" font-size="9.5" font-weight="600" fill="#8d611d">2 uncertain values to review</text>
  <text x="1405" y="436" text-anchor="end" font-size="9" font-weight="650" fill="#9c6b1e">Review</text>
  <line x1="1134" y1="466" x2="1417" y2="466" class="line"/>

  <!-- Extracted text -->
  <text x="1134" y="493" class="label muted">EXTRACTED TEXT</text>
  <rect x="1134" y="506" width="283" height="30" rx="6" fill="#fff" stroke="#e2e4e6"/>
  <circle cx="1149" cy="520" r="4.5" fill="none" stroke="#83888e" stroke-width="1.1"/>
  <path d="m1152.5 523.5 3.5 3.5" stroke="#83888e" stroke-width="1.1" stroke-linecap="round"/>
  <text x="1163" y="524" font-size="9.5" class="muted">Find in extracted text</text>

  <text x="1134" y="563" class="tiny muted">PAGE 1</text>
  <text x="1134" y="587" class="small" font-weight="600">Invoice No.</text>
  <text x="1417" y="587" text-anchor="end" class="small">NS-2026-0881</text>
  <text x="1134" y="610" class="small" font-weight="600">Invoice date</text>
  <text x="1417" y="610" text-anchor="end" class="small">October 28, 2026</text>
  <text x="1134" y="633" class="small" font-weight="600">Total due</text>
  <rect x="1335" y="618" width="82" height="22" rx="4" fill="#fff3d7"/>
  <text x="1407" y="633" text-anchor="end" class="small" font-weight="650">$4,280.00</text>
  <text x="1134" y="654" font-size="9" fill="#98651c">Highlighted value may need verification.</text>

  <rect x="1134" y="677" width="283" height="36" rx="7" fill="#fff" stroke="#dfe1e4"/>
  <text x="1275" y="700" text-anchor="middle" class="small" font-weight="600">Copy page text</text>
  <text x="1134" y="741" class="tiny muted">OCR text remains separate from the clean layout.</text>
  <text x="1134" y="757" class="tiny muted">Select text to copy or compare it with the original.</text>

  <!-- Small bottom state strip -->
  <line x1="1134" y1="792" x2="1417" y2="792" class="line"/>
  <rect x="1134" y="812" width="8" height="8" rx="4" fill="#39815d"/>
  <text x="1150" y="820" class="tiny muted">Original PDF is preserved for comparison.</text>
  <text x="1134" y="916" class="tiny soft">Sample invoice shown for layout preview</text>
